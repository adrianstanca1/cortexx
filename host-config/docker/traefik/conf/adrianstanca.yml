http:
  routers:
    adrianstanca-www:
      rule: "Host(`www.adrianstanca.com`)"
      entryPoints: [websecure]
      service: adrianstanca
      tls: { certResolver: letsencrypt }
    adrianstanca-apex:
      rule: "Host(`adrianstanca.com`)"
      entryPoints: [websecure]
      service: adrianstanca
      tls: { certResolver: letsencrypt }
  services:
    adrianstanca:
      loadBalancer:
        servers:
          - url: "http://172.16.3.20:80"
