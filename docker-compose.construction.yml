name: cortexbuild-construction
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated database password}
    volumes:
      - construction_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U construction -d construction']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - construction_redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - construction_ollama:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
  browser-gateway:
    build:
      context: ./browser-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BROWSER_GATEWAY_INTERNAL_TOKEN: ${BROWSER_GATEWAY_INTERNAL_TOKEN:?Set a generated browser gateway token}
      PORT: 3002
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      MAX_BROWSER_SESSIONS: '4'
      BROWSER_SESSION_IDLE_MS: '900000'
    expose:
      - '3002'
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m
    networks:
      - browser_control
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  app:
    build:
      context: .
      dockerfile: Dockerfile.construction
      target: runtime
    restart: unless-stopped
    env_file: .env.construction
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ADMIN_TENANT: 'true'
      MULTITENANT_ENFORCED: 'true'
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: https://cortexbuildpro.tech
      AUTH_URL: https://cortexbuildpro.tech
      NEXT_PUBLIC_SITE_URL: https://cortexbuildpro.tech
      REDIS_URL: redis://redis:6379
      BROWSER_GATEWAY_URL: http://browser-gateway:3002
      BROWSER_GATEWAY_INTERNAL_TOKEN: ${BROWSER_GATEWAY_INTERNAL_TOKEN:?Set a generated browser gateway token}
      OLLAMA_BASE_URL: http://ollama:11434
      UPLOAD_DIR: /app/uploads
      npm_package_version: 1.5.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - '127.0.0.1:3020:3000'
    volumes:
      - construction_uploads:/app/uploads
    networks:
      - default
      - browser_control
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.construction
      target: tools
    env_file: .env.construction
    depends_on:
      db:
        condition: service_healthy
networks:
  browser_control:
    driver: bridge
volumes:
  construction_db:
  construction_redis:
  construction_uploads:
  construction_ollama:
