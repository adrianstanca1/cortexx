<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex Agent OS</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2ff;background:#070b14}*{box-sizing:border-box}body{margin:0}.shell{max-width:1400px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:28px;font-weight:800}.muted{color:#93a4bd}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:20px}.card{background:#0e1626;border:1px solid #1e2b44;border-radius:16px;padding:18px}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid #2a3853;background:#09111f;color:#fff;padding:12px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#5d7cff;color:white}.stats{display:flex;gap:16px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#18253a}.item{padding:12px 0;border-bottom:1px solid #1a2740}.ok{color:#6ee7b7}.bad{color:#fb7185}@media(max-width:800px){.wide,.side{grid-column:1/-1}.hero{align-items:flex-start;flex-direction:column}}</style></head><body><div class="shell"><div class="hero"><div><div class="brand">Cortex Agent OS</div><div class="muted">Local-first autonomous mission control</div></div><div id="health" class="pill">Checking system…</div></div>
<div class="grid"><section class="card wide"><h2>New mission</h2><textarea id="goal" placeholder="e.g. Find UK cladding tenders, score them, and prepare a bid shortlist"></textarea><p><button onclick="createMission()">Launch mission</button></p><div id="missions"></div></section><aside class="card side"><h2>System</h2><div id="status"></div><h3>Approvals</h3><div id="approvals"></div></aside><section class="card full"><h2>Live activity</h2><div id="events"></div></section></div></div><script>
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function j(p,o){const r=await fetch(p,o);return r.json()}async function refresh(){const [s,m,a]=await Promise.all([j('/api/status'),j('/api/missions'),j('/api/approvals')]);health.innerHTML=`<span class=${s.models.some(x=>x.healthy)?'ok':'bad'}>●</span> ${s.models.some(x=>x.healthy)?'AI online':'No model online'}`;status.innerHTML=`<div class=stats><span class=pill>${s.agents} agents</span><span class=pill>${s.missions} missions</span><span class=pill>${s.pendingApprovals} pending</span></div>`;missions.innerHTML=m.map(x=>`<div class=item><b>${esc(x.goal)}</b><br><span class=muted>${x.status} · ${new Date(x.createdAt).toLocaleString()}</span></div>`).join('')||'<div class=muted>No missions yet.</div>';approvals.innerHTML=a.filter(x=>x.status==='pending').map(x=>`<div class=item>${esc(x.action)}<br><button onclick="approve('${x.id}')">Approve</button></div>`).join('')||'<div class=muted>Nothing waiting.</div>'}
async function createMission(){const goal=document.getElementById('goal').value.trim();if(!goal)return;await j('/api/missions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal})});document.getElementById('goal').value='';refresh()}async function approve(id){await j('/api/approvals/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:'approved'})});refresh()}const es=new EventSource('/api/events/stream');es.onmessage=e=>{const x=JSON.parse(e.data);events.innerHTML=`<div class=item><b>${esc(x.type)}</b> <span class=muted>${new Date(x.at).toLocaleTimeString()}</span></div>`+events.innerHTML;refresh()};refresh();setInterval(refresh,8000);
</script></body></html>
