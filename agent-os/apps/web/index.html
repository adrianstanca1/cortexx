<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex Agent OS</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#e8f0fb;margin:0}.wrap{max-width:980px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{padding:7px 10px;border:1px solid #29405f;border-radius:999px;color:#8fc7ff}.panel{background:#0c1a2c;border:1px solid #203752;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 16px 40px #0005}textarea{width:100%;box-sizing:border-box;background:#07111f;color:#fff;border:1px solid #2a4565;border-radius:12px;padding:14px;min-height:100px}button{background:#4da3ff;color:#04111f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:10px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#0a1626;border:1px solid #1e3450;border-radius:14px;padding:14px}.muted{color:#91a4bd}.status{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em}</style></head>
<body><div class="wrap"><div class="hero"><div><div class="badge">LOCAL-FIRST AGENT RUNTIME</div><h1>Cortex Agent OS</h1><p class="muted">Mission control for autonomous AI teams.</p></div><div id="health" class="badge">checking…</div></div>
<div class="panel"><h2>Launch mission</h2><textarea id="goal" placeholder="Example: Build a procurement agent for UK construction suppliers"></textarea><button onclick="launch()">Create & Run</button></div>
<div class="panel"><h2>Agents</h2><div id="agents" class="row"></div></div>
<div class="panel"><h2>Missions</h2><div id="missions"></div></div></div>
<script>
const api='';
async function refresh(){
 const h=await fetch(api+'/health').then(r=>r.json()).catch(()=>({ok:false})); document.getElementById('health').textContent=h.ok?'API ONLINE':'API OFFLINE';
 const agents=await fetch(api+'/api/agents').then(r=>r.json()).catch(()=>[]); document.getElementById('agents').innerHTML=agents.map(a=>`<div class="card"><b>${a.name}</b><div class="muted">${a.role}</div><div>${a.capabilities.join(', ')}</div></div>`).join('');
 const missions=await fetch(api+'/api/missions').then(r=>r.json()).catch(()=>[]); document.getElementById('missions').innerHTML=missions.length?missions.reverse().map(m=>`<div class="card" style="margin:10px 0"><div class="status">${m.status}</div><b>${m.goal}</b><div class="muted">${m.summary||'Queued'}</div></div>`).join(''):'<div class="muted">No missions yet.</div>';
}
async function launch(){const goal=document.getElementById('goal').value.trim(); if(!goal)return; const m=await fetch(api+'/api/missions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal})}).then(r=>r.json()); await fetch(api+`/api/missions/${m.id}/run`,{method:'POST'}); document.getElementById('goal').value=''; refresh();}
refresh();
</script></body></html>
