name: EAS iOS — Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      what_to_test:
        description: TestFlight "What to Test" note
        required: false
        default: Cortexx release candidate

permissions:
  contents: read

concurrency:
  group: cortexx-eas-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS build and TestFlight submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured. Add an Expo personal access token as the repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Install native dependencies
        run: npm ci --ignore-scripts

      - name: Verify Expo TypeScript
        run: npx tsc --noEmit

      - name: Verify EAS account and project
        run: |
          npx eas-cli@21.0.1 whoami
          npx eas-cli@21.0.1 project:info

      - name: Build signed iOS app and auto-submit to TestFlight
        env:
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          npx eas-cli@21.0.1 build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --wait \
            --non-interactive \
            --freeze-credentials \
            --message "GitHub release ${GITHUB_SHA}" \
            --what-to-test "$WHAT_TO_TEST"

      - name: Show submitted build
        if: success()
        run: npx eas-cli@21.0.1 build:list --platform ios --status finished --limit 1 --json --non-interactive
