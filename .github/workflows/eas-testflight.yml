name: EAS iOS — Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Existing successful Expo iOS build ID (skips rebuilding)"
        required: false
        default: ""
      apple_build_number:
        description: "Apple build number to verify (blank checks newest available build)"
        required: false
        default: ""
      upload_method:
        description: "Submission path (direct sends the signed IPA to Apple from macOS)"
        required: false
        type: choice
        default: expo
        options:
          - expo
          - direct
          - status
      what_to_test:
        description: Legacy release note (not sent to Expo Submit on non-Enterprise plans)
        required: false
        default: Cortexx release candidate

permissions:
  contents: read

concurrency:
  group: cortexx-eas-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: ${{ inputs.upload_method == 'expo' }}
    name: EAS build and TestFlight submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_TEAM_ID: "4G3G5MX9BH"
      EXPO_APPLE_TEAM_TYPE: "INDIVIDUAL"
      CI: "1"

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Require Expo access token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured. Add an Expo personal access token as the repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Install native dependencies
        run: npm ci --ignore-scripts

      - name: Verify Expo TypeScript
        run: npx tsc --noEmit

      - name: Verify EAS account and project
        run: |
          npx eas-cli@21.0.1 whoami
          npx eas-cli@21.0.1 project:info

      - name: Validate Apple-issued App Store Connect team key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_BASE64" ]; then
            echo "::error::Configure the Apple Team Key ID, Issuer ID, and base64-encoded .p8 private key as repository secrets."
            exit 1
          fi
          if ! printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_KEY_BASE64 is not valid base64."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          if ! grep -Fxq -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/AuthKey.p8" || ! openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout >/dev/null 2>&1; then
            echo "::error::The Apple key must decode to an unencrypted PKCS#8 PEM (.p8); upload an original Apple-issued team key."
            exit 1
          fi
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "EXPO_ASC_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Verify Apple Team Key against App Store Connect
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { sign } = require('node:crypto');
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = encode({ alg: 'ES256', kid: process.env.EXPO_ASC_KEY_ID, typ: 'JWT' });
          const payload = encode({
            iss: process.env.EXPO_ASC_ISSUER_ID,
            iat: now,
            exp: now + 300,
            aud: 'appstoreconnect-v1',
          });
          const data = header + '.' + payload;
          const signature = sign('sha256', Buffer.from(data), {
            key: readFileSync(process.env.EXPO_ASC_API_KEY_PATH),
            dsaEncoding: 'ieee-p1363',
          }).toString('base64url');
          const token = data + '.' + signature;
          const url = 'https://api.appstoreconnect.apple.com/v1/apps/6820322670';
          fetch(url, { headers: { authorization: 'Bearer ' + token } })
            .then(async (response) => {
              if (!response.ok) {
                console.error('Apple App Store Connect API authentication/authorization failed (HTTP ' + response.status + '). Verify matching Team Key ID, issuer ID and .p8.');
                process.exitCode = 1;
                return;
              }
              const parsed = await response.json();
              if (parsed.data?.id !== '6820322670' || parsed.data?.attributes?.bundleId !== 'com.cortexbuild.app') {
                console.error('Apple API key is valid but does not see the expected Cortexx App Store Connect app.');
                process.exitCode = 1;
                return;
              }
              console.log('Apple Team Key authenticated; Cortexx app record verified.');
            })
            .catch(() => {
              console.error('Apple App Store Connect API preflight network request failed.');
              process.exitCode = 1;
            });
          NODE

      - name: Build signed iOS app
        if: ${{ inputs.build_id == '' }}
        id: build
        run: |
          set -euo pipefail
          BUILD_JSON="$RUNNER_TEMP/eas-build.json"
          npx eas-cli@21.0.1 build \
            --platform ios \
            --profile production \
            --wait \
            --non-interactive \
            --message "GitHub release ${GITHUB_SHA}" \
            --json > "$BUILD_JSON"

          BUILD_ID="$(node -e '
            const fs = require("fs");
            const parsed = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const build = Array.isArray(parsed) ? parsed[0] : parsed;
            if (!build || !build.id) {
              console.error("EAS build output did not contain a build id");
              process.exit(1);
            }
            process.stdout.write(build.id);
          ' "$BUILD_JSON")"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Submit exact build to TestFlight and wait for Apple
        env:
          BUILD_ID: ${{ inputs.build_id || steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then
            echo "::error::No EAS build ID provided or generated."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const ios = config.submit.production.ios;
            if (!ios.ascAppId) throw new Error("Missing App Store Connect app ID in eas.json");
            ios.ascApiKeyPath = process.env.EXPO_ASC_API_KEY_PATH;
            ios.ascApiKeyId = process.env.EXPO_ASC_KEY_ID;
            ios.ascApiKeyIssuerId = process.env.EXPO_ASC_ISSUER_ID;
            fs.writeFileSync("eas.json", JSON.stringify(config, null, 2));
          '
          npx eas-cli@21.0.1 submit \
            --platform ios \
            --profile production \
            --id "$BUILD_ID" \
            --wait \
            --non-interactive

      - name: Clean up App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  direct-apple-upload:
    if: ${{ inputs.upload_method == 'direct' }}
    name: Upload existing signed IPA directly to Apple
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      BUILD_ID: ${{ inputs.build_id }}
      CORTEXX_SIGNED_IPA_URL: ${{ secrets.CORTEXX_SIGNED_IPA_URL }}

    steps:
      - name: Checkout release for Expo config
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for Expo CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate direct upload inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_BASE64" ] || [ -z "$BUILD_ID" ]; then
            echo "::error::Direct Apple upload requires Expo token, App Store Connect team credentials, and an existing EAS build ID."
            exit 1
          fi

      - name: Download exact signed production IPA
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CORTEXX_SIGNED_IPA_URL" ]; then
            echo "::error::Missing temporary signed IPA download secret."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/Cortexx.ipa" "$CORTEXX_SIGNED_IPA_URL"
          unzip -t "$RUNNER_TEMP/Cortexx.ipa" > /dev/null
          unzip -Z -1 "$RUNNER_TEMP/Cortexx.ipa" > "$RUNNER_TEMP/ipa-entries.txt"
          grep -Eq "^Payload/[^/]+\\.app/Info\\.plist$" "$RUNNER_TEMP/ipa-entries.txt"
          unzip -oq "$RUNNER_TEMP/Cortexx.ipa" "Payload/*.app/Info.plist" -d "$RUNNER_TEMP/verify"
          INFO_FILE="$(find "$RUNNER_TEMP/verify" -name Info.plist -print -quit)"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_FILE")"
          if [ "$BUNDLE_ID" != "com.cortexbuild.app" ]; then
            echo "::error::Downloaded IPA does not match the Cortexx production bundle ID."
            exit 1
          fi
          echo "Signed Cortexx IPA downloaded, archive validated and bundle ID verified."

      - name: Install Apple-issued API key in ephemeral macOS runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf "%s" "$APP_STORE_CONNECT_KEY_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "::error::GitHub secret does not decode to a valid Apple PKCS#8 private key."
            exit 1
          fi

      - name: Upload signed IPA directly to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Cortexx.ipa" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove ephemeral Apple key and IPA
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" "$RUNNER_TEMP/Cortexx.ipa" "$RUNNER_TEMP/eas-build.json"

  check-apple-testflight:
    if: ${{ inputs.upload_method == 'status' }}
    name: Check Apple TestFlight processing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      APPLE_BUILD_NUMBER: ${{ inputs.apple_build_number }}
    steps:
      - name: Verify Cortexx build and testing groups in Apple
        run: |
          node <<'NODE'
          const { sign } = require("node:crypto");
          const base = value => Buffer.from(JSON.stringify(value)).toString("base64url");
          async function main() {
            const now = Math.floor(Date.now() / 1000);
            const head = base({ alg: "ES256", kid: process.env.APP_STORE_CONNECT_KEY_ID, typ: "JWT" });
            const body = base({ iss: process.env.APP_STORE_CONNECT_ISSUER_ID, iat: now, exp: now + 300, aud: "appstoreconnect-v1" });
            const data = head + "." + body;
            const key = Buffer.from(process.env.APP_STORE_CONNECT_KEY_BASE64, "base64").toString("utf8");
            const signature = sign("sha256", Buffer.from(data), { key, dsaEncoding: "ieee-p1363" }).toString("base64url");
            const headers = { authorization: "Bearer " + data + "." + signature };
            const request = async path => {
              const response = await fetch("https://api.appstoreconnect.apple.com" + path, { headers });
              if (!response.ok) throw Error("Apple API returned HTTP " + response.status);
              return response.json();
            };
            const app = "6820322670";
            const appRecord = await request("/v1/apps/" + app);
            console.log("TestFlight target App Store Connect name: " + appRecord.data?.attributes?.name);
            console.log("TestFlight target Apple app ID: " + appRecord.data?.id);
            console.log("TestFlight target bundle identifier: " + appRecord.data?.attributes?.bundleId);
            const availableApps = await request("/v1/apps?limit=200");
            const cortexxApps = (availableApps.data || []).filter(x => /cortexx/i.test(x.attributes?.name || ""));
            console.log("Existing Apple records named Cortexx: " + JSON.stringify(cortexxApps.map(x => ({
              id: x.id, name: x.attributes.name, bundleId: x.attributes.bundleId
            }))));
            const builds = await request("/v1/builds?filter%5Bapp%5D=" + app + "&limit=100&sort=-uploadedDate");
            const latest = (builds.data || []).find(x => !process.env.APPLE_BUILD_NUMBER || x.attributes?.version === process.env.APPLE_BUILD_NUMBER);
            if (!latest) {
              console.error("Cortexx build " + (process.env.APPLE_BUILD_NUMBER || "latest") + " is not yet visible in Apple builds.");
              process.exitCode = 1;
            } else {
              console.log("Cortexx Apple build ID: " + latest.id);
              console.log("Cortexx build number: " + latest.attributes.version);
              console.log("Apple processing state: " + latest.attributes.processingState);
              if (latest.attributes.processingState !== "VALID") {
                console.error("Cortexx is not ready for TestFlight: Apple processing state is " + latest.attributes.processingState);
                process.exitCode = 1;
              }
            }
            const groups = await request("/v1/betaGroups?filter%5Bapp%5D=" + app + "&limit=100");
            const internal = (groups.data || []).filter(g => g.attributes?.isInternalGroup);
            if (internal.length === 0) process.exitCode = 1;
            console.log("Internal TestFlight groups: " + internal.length);
            for (const g of internal) {
              console.log("Group: " + g.attributes.name + "; auto-distribute: " + !!g.attributes.hasAccessToAllBuilds);
              const members = await request("/v1/betaGroups/" + encodeURIComponent(g.id) + "/betaTesters?limit=200");
              const assigned = await request("/v1/betaGroups/" + encodeURIComponent(g.id) + "/builds?limit=200");
              const included = (assigned.data || []).some(x => x.id === latest?.id);
              console.log("Internal group tester count: " + (members.data || []).length);
              console.log("Cortexx build " + (latest?.attributes?.version || "unknown") + " assigned to internal group: " + included);
              if (latest && !included) process.exitCode = 1;
            }
            if (latest) {
              const details = await request("/v1/buildBetaDetails?filter%5Bbuild%5D=" + encodeURIComponent(latest.id));
              const state = (details.data || [])[0]?.attributes?.internalBuildState || "PENDING";
              console.log("Apple internal TestFlight state: " + state);
              if (state !== "IN_BETA_TESTING") process.exitCode = 1;
            }
          }
          main().catch(error => { console.error("Apple verification failed: " + error.message); process.exitCode = 1; });
          NODE
