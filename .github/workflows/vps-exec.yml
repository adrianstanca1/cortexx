name: VPS Exec retired — VPS-free migration in progress

# Retired because the former VPS and SSH access are unavailable. This workflow
# is intentionally inert. Do not add SSH credentials or re-enable it as part of
# the VPS-free migration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "VPS remote execution is retired. See docs/VPS_FREE_MIGRATION.md."
