name: VPS Exec retired — replacement VPS uses reviewed rebuild workflow

# Keep arbitrary remote shell execution disabled. The only current SSH workflow
# is the gated, app-only replacement VPS rebuild in deploy-vps.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Arbitrary VPS execution is disabled. Use the reviewed rebuild workflow."
