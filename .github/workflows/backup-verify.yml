name: Backup Verify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: construction-backup-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: 85.190.100.68
      VPS_USER: administrator
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.CORTEXX_BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Configure SSH client
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KEY:-}" && -z "${VPS_PASSWORD:-}" ]]; then
            echo "::error::Configure VPS_SSH_PRIVATE_KEY or VPS_ROOT_PASSWORD."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cortexx_deploy
            chmod 600 ~/.ssh/cortexx_deploy
          fi
          if [[ -n "${VPS_PASSWORD:-}" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Resolve SSH authentication
        run: |
          set -euo pipefail
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          if [[ -s ~/.ssh/cortexx_deploy ]] && ssh "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$VPS_USER@$VPS_HOST" 'echo SSH_OK' >/dev/null 2>&1; then
            echo "CORTEXX_SSH_MODE=key" >> "$GITHUB_ENV"
            echo "SSH key authentication ready."
            exit 0
          fi
          if [[ -n "${VPS_PASSWORD:-}" ]]; then
            export SSHPASS="$VPS_PASSWORD"
            if sshpass -e ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST" 'echo SSH_OK' >/dev/null 2>&1; then
              echo "CORTEXX_SSH_MODE=password" >> "$GITHUB_ENV"
              echo "SSH password authentication ready."
              exit 0
            fi
          fi
          echo "::error::Could not authenticate to $VPS_USER@$VPS_HOST."
          exit 1

      - name: Verify latest construction backup on current VPS
        run: |
          set -euo pipefail
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          if [[ "$CORTEXX_SSH_MODE" == key ]]; then
            REMOTE=(ssh "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$VPS_USER@$VPS_HOST")
          else
            export SSHPASS="$VPS_PASSWORD"
            REMOTE=(sshpass -e ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST")
          fi
          "${REMOTE[@]}" 'bash "$HOME/bin/construction-verify-latest.sh"' 2>&1 | tee /tmp/construction-verify.log
          {
            echo '## Construction backup restore verified'
            echo '```'
            cat /tmp/construction-verify.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export encrypted off-site backup
        run: |
          set -euo pipefail
          if [[ -z "${BACKUP_ENCRYPTION_KEY:-}" ]]; then
            echo "::error::CORTEXX_BACKUP_ENCRYPTION_KEY is not configured."
            exit 1
          fi
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          if [[ "$CORTEXX_SSH_MODE" == key ]]; then
            REMOTE=(ssh "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$VPS_USER@$VPS_HOST")
          else
            export SSHPASS="$VPS_PASSWORD"
            REMOTE=(sshpass -e ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST")
          fi
          mkdir -p /tmp/cortexx-offsite
          ARCHIVE="/tmp/cortexx-offsite/construction-backup-${GITHUB_RUN_ID}.tar.gz.enc"
          "${REMOTE[@]}" 'set -euo pipefail
            BACKUP_DIR="${BACKUP_DIR:-$HOME/backups/construction}"
            marker="$BACKUP_DIR/.last-local-success"
            [[ -s "$marker" ]] || { echo "No successful backup marker" >&2; exit 1; }
            backup="$(realpath "$(cat "$marker")")"
            root="$(realpath "$BACKUP_DIR")"
            [[ "$(dirname "$backup")" == "$root" && "$(basename "$backup")" == construction-* ]] || {
              echo "Backup marker is outside managed backup directory" >&2
              exit 1
            }
            APP_DIR=/home/administrator/production/cortexx
            for secret in .env.construction .owner-credentials; do
              [[ -s "$APP_DIR/$secret" ]] || { echo "Required recovery secret missing: $secret" >&2; exit 1; }
              [[ "$(stat -c "%a" "$APP_DIR/$secret")" == 600 ]] || { echo "Recovery secret permissions must be 600: $secret" >&2; exit 1; }
            done
            tar -czf - -C "$root" "$(basename "$backup")" -C "$APP_DIR" .env.construction .owner-credentials' \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                -pass env:BACKUP_ENCRYPTION_KEY -out "$ARCHIVE"
          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "OFFSITE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Verify encrypted off-site archive
        run: |
          set -euo pipefail
          test -s "$OFFSITE_ARCHIVE"
          sha256sum -c "$OFFSITE_ARCHIVE.sha256"
          PLAIN="/tmp/cortexx-offsite/restore.tar.gz"
          VERIFY_DIR="/tmp/cortexx-offsite/verify"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000             -pass env:BACKUP_ENCRYPTION_KEY             -in "$OFFSITE_ARCHIVE" -out "$PLAIN"
          tar -tzf "$PLAIN" >/dev/null
          mkdir -p "$VERIFY_DIR"
          tar -xzf "$PLAIN" -C "$VERIFY_DIR"
          mapfile -t BACKUPS < <(find "$VERIFY_DIR" -mindepth 1 -maxdepth 1 -type d -name 'construction-*' -print)
          [[ "${#BACKUPS[@]}" -eq 1 ]] || { echo "::error::Encrypted archive must contain exactly one managed backup."; exit 1; }
          for secret in .env.construction .owner-credentials; do
            [[ -s "$VERIFY_DIR/$secret" ]] || { echo "::error::Encrypted archive is missing $secret."; exit 1; }
            [[ "$(stat -c '%a' "$VERIFY_DIR/$secret")" == 600 ]] || { echo "::error::Recovered $secret permissions are not 600."; exit 1; }
          done
          grep -q '^DATABASE_URL=' "$VERIFY_DIR/.env.construction"
          grep -q '^NEXTAUTH_SECRET=' "$VERIFY_DIR/.env.construction"
          grep -q '^CRON_SECRET=' "$VERIFY_DIR/.env.construction"
          grep -q '^URL=' "$VERIFY_DIR/.owner-credentials"
          grep -q '^EMAIL=' "$VERIFY_DIR/.owner-credentials"
          grep -q '^PASSWORD=' "$VERIFY_DIR/.owner-credentials"
          BACKUP="${BACKUPS[0]}"
          (cd "$BACKUP" && sha256sum -c SHA256SUMS)
          gzip -t "$BACKUP/uploads.tar.gz"
          IMAGE="$(cat "$BACKUP/postgres-image.txt")"
          [[ "$IMAGE" == postgres:* ]] || { echo "::error::Unexpected PostgreSQL image in backup."; exit 1; }
          NAME="cortexx-offsite-restore-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -fv "$NAME" >/dev/null 2>&1 || true
            rm -rf "$VERIFY_DIR" "$PLAIN"
          }
          trap cleanup EXIT
          docker run -d --name "$NAME" --network none             -e POSTGRES_HOST_AUTH_METHOD=trust "$IMAGE" >/dev/null
          READY=false
          for attempt in {1..60}; do
            if docker exec "$NAME" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then READY=true; break; fi
            sleep 1
          done
          [[ "$READY" == true ]] || { echo "::error::Off-site restore database failed to start."; exit 1; }
          docker exec "$NAME" createdb -U postgres restore_drill
          docker exec -i "$NAME" pg_restore -U postgres -d restore_drill --no-owner --no-acl --exit-on-error < "$BACKUP/database.dump"
          TABLES="$(docker exec "$NAME" psql -U postgres -d restore_drill -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          [[ "$TABLES" =~ ^[0-9]+$ && "$TABLES" -gt 0 ]]
          {
            echo
            echo '## Encrypted off-site backup verified'
            echo "- Restored tables: $TABLES"
            echo '- Encryption: AES-256-CBC + PBKDF2 (200,000 iterations)'
            echo '- Artifact contains ciphertext only; the encryption key remains a GitHub secret.'
            echo '- Protected recovery payload: database, uploads, .env.construction and owner credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain encrypted off-site backup
        uses: actions/upload-artifact@v4
        with:
          name: construction-backup-${{ github.run_id }}
          path: |
            ${{ env.OFFSITE_ARCHIVE }}
            ${{ env.OFFSITE_ARCHIVE }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Report recovery verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Do not depend on pre-existing labels or include database contents.
          EXISTING=$(gh issue list --state open --search '"[Recovery] Construction backup verification failed" in:title' --json number --jq '.[0].number // empty')
          {
            echo 'The construction disaster-recovery chain failed. Check SSH access, backup freshness, local restore verification, encrypted off-site export, and artifact restore validation before relying on recovery.'
            echo
            echo "Run: $RUN_URL"
            echo
            echo 'On the One.com VPS, inspect ~/logs/construction-backup.log and run bash ~/bin/construction-verify-latest.sh.'
            echo 'A successful run must include both the local isolated restore and the encrypted GitHub Actions backup artifact.'
          } > /tmp/recovery-issue.md
          if [[ -z "$EXISTING" ]]; then
            gh issue create --title '[Recovery] Construction backup verification failed' --body-file /tmp/recovery-issue.md
          else
            gh issue comment "$EXISTING" --body-file /tmp/recovery-issue.md
          fi
