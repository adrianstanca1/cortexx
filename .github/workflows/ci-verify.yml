name: ci-verify
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Fail fast + don't pile up runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this change can affect a native iOS build. The native
  # macOS preflight is expensive and unrelated server/dependency changes
  # should not be blocked by an unavailable macOS runner.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios_changed: ${{ steps.filter.outputs.ios_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$head" | grep -Eq '^(ios/|expo/|agent-os/|packages/core/|.github/workflows/ios-build.yml$)'; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --unified=0 "$base" "$head" -- package.json package-lock.json | grep -Eq '^[+-].*(@capacitor/|@ionic/|@expo/|expo-|"expo"|react-native|@react-native/|metro|@babel/|babel-preset-expo)'; then
            echo "ios_changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected a native-affecting dependency change in root package manifests."
          else
            echo "ios_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Shared core / Expo RN typecheck + unit tests (Linux, no Mac) ──
  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }

      # Root deps provide the tsc binary used by packages/core + the server test.
      - name: Install root deps
        run: npm ci --no-audit --no-fund

      # Shared core (offline cache, write-queue, realtime client)
      - name: Typecheck shared core
        working-directory: packages/core
        run: ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Test shared core
        working-directory: packages/core
        run: npx tsx --test test/*.test.ts

      # Backend integration (mocked pg — no DB needed)
      # Server tests require server/node_modules (express, pg, etc.).
      - name: Install server deps
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Test backend routes
        working-directory: server
        run: npx tsx --test test/*.test.js

      # Cortex Agent OS — runtime + governed Expo mobile control surface
      - name: Verify Agent OS runtime
        run: |
          npx tsc -p agent-os/tsconfig.json --noEmit
          rm -rf agent-os/dist
          npx tsc -p agent-os/tsconfig.json
          node --test agent-os/dist/tests/*.test.js

      - name: Install Agent OS mobile deps
        working-directory: agent-os/apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck Agent OS mobile
        working-directory: agent-os/apps/mobile
        run: npm run typecheck

      # Expo RN iOS app — its own lockfile + node_modules
      - name: Install Expo deps
        working-directory: expo
        run: npm ci --no-audit --no-fund

      - name: Typecheck Expo
        working-directory: expo
        run: CI=1 npx tsc --noEmit

      - name: Expo doctor
        continue-on-error: true
        working-directory: expo
        run: CI=1 npx expo-doctor

      - name: Expo native push test
        run: npx tsx --test test/push-native.test.js

      # Prove the JS actually bundles (clean tsc ≠ bundlable)
      - name: Expo export (web bundle)
        working-directory: expo
        run: CI=1 npx expo export --platform web

  # ── Capacitor web build (the asset bundle the iOS shell serves) ──
  capacitor-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm', cache-dependency-path: ios/package-lock.json }
      - name: Build Capacitor web bundle
        working-directory: ios
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
      - name: Assert index.html produced
        working-directory: ios
        run: test -f www/index.html || (echo "www/index.html missing" && exit 1)

  # ── Native iOS build pre-flight (needs macOS — validates Pods + xcodebuild) ──
  ios-build:
    needs: changes
    if: needs.changes.outputs.ios_changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Install JS deps (root + Capacitor ios shell)
        run: |
          npm install --no-audit --no-fund
          cd ios && npm install --no-audit --no-fund
      - name: pod install (Capacitor App)
        working-directory: ios/App
        run: pod install --no-repo-update
      - name: xcodebuild (simulator, no signing)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS Simulator' \
            build | tail -20
