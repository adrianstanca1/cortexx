name: Deploy CortexBuild Pro to 85.190.100.68

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VPS_HOST: 85.190.100.68
      VPS_USER: administrator
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      APP_URL: https://cortexbuildpro.tech
    steps:
      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KEY:-}" && -z "${VPS_PASSWORD:-}" ]]; then
            echo "::error::Set either VPS_SSH_KEY or VPS_PASSWORD in secrets."
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          # Known hosts — populated at runtime to match the actual VPS key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${VPS_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - uses: actions/checkout@v7

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"

          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            SSH_CMD="ssh ${SSH_OPTS} -i ~/.ssh/id_ed25519 ${VPS_USER}@${VPS_HOST}"
          else
            SSH_CMD="sshpass -p '${VPS_PASSWORD}' ssh ${SSH_OPTS} ${VPS_USER}@${VPS_HOST}"
          fi

          $SSH_CMD 'bash -s' << 'REMOTE'
            set -euo pipefail
            APP_DIR=/opt/cortexx

            echo "=== Install deploy artifacts if first run ==="
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/adrianstanca1/cortexx.git "$APP_DIR" 2>&1 | tail -3
            fi
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main
            echo "Checked out: $(git rev-parse --short HEAD)"

            echo "=== Write compose + env if missing ==="
            if [ ! -f docker-compose.cortexx.yml ]; then
              # docker-compose.cortexx.yml is now in the repo — no external artifacts needed
              echo "  ⚠ docker-compose.cortexx.yml not in repo — cannot deploy"
              exit 1
            fi
            if [ ! -f server/.env ]; then
              cp server/.env.example server/.env 2>/dev/null || cp server.env.template server/.env 2>/dev/null || true
            fi

            echo "=== Bring stack up ==="
            docker compose -f docker-compose.cortexx.yml pull
            deployed=false
            for up in 1 2 3; do
              sleep 5
              if docker compose -f docker-compose.cortexx.yml up -d --build --remove-orphans 2>&1; then
                deployed=true
                break
              fi
              echo "docker compose up attempt $up failed — retrying"
              sleep 10
            done

            if [ "$deployed" != true ]; then
              echo "Docker Compose failed after all attempts" >&2
              exit 1
            fi

            echo "=== Wait for health ==="
            healthy=false
            for n in $(seq 1 36); do
              # Validate the construction API contract inside the API container,
              # which always has Node. A different app returning 200 is not ready.
              if curl --fail --silent --show-error --max-time 5 https://cortexbuildpro.tech/api/health |
                docker compose -f docker-compose.cortexx.yml exec -T api node -e '
                  let input = "";
                  process.stdin.on("data", c => input += c);
                  process.stdin.on("end", () => {
                    try {
                      const h = JSON.parse(input);
                      if (h.status !== "ok" || h.db !== "up" || h.version !== require("./package.json").version || !Number.isFinite(h.ts) || !Number.isInteger(h.streams)) process.exit(1);
                    } catch { process.exit(1); }
                  });'; then
                echo "Construction API ready"
                healthy=true
                break
              fi
              echo "  try $n: construction API not ready"
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "API did not become healthy before the deadline" >&2
              exit 1
            fi
          REMOTE

      - name: Verify deployment
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -o /dev/null --max-time 20 -w "HTTPS root   -> %{http_code}\n" https://cortexbuildpro.tech/
          curl --fail --silent --show-error -o /dev/null --max-time 20 -w "HTTPS health -> %{http_code}\n" https://cortexbuildpro.tech/api/health
          echo "=== Health body ==="
          curl --fail --silent --show-error --max-time 10 https://cortexbuildpro.tech/api/health | node scripts/check-construction-health.cjs
          echo ""
          echo "=== Direct (port 8080) ==="
          curl --fail --silent --show-error -o /dev/null --max-time 10 -w "Direct health -> %{http_code}\n" http://${VPS_HOST}:8080/api/health
