name: Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health and critical pages
        id: check
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://cortexbuildpro.tech'
          HEALTH_BODY="$(mktemp)"
          trap 'rm -f "$HEALTH_BODY"' EXIT

          HEALTH_STATUS="$(curl -sS -L --connect-timeout 10 --max-time 20 -o "$HEALTH_BODY" -w '%{http_code}' "$BASE/api/health" || true)"
          echo "Health endpoint HTTP $HEALTH_STATUS"
          echo "health_status=$HEALTH_STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$HEALTH_STATUS" == "200" ]]; then
            echo 'Health endpoint returned HTTP 200.'
          else
            echo "::error::Health endpoint returned HTTP $HEALTH_STATUS"
          fi

          FAILED=0
          for path in / /dashboard /projects /tasks /team; do
            CODE="$(curl -sS -L --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$path" || true)"
            echo "$path -> $CODE"
            if [[ "$CODE" != "200" && "$CODE" != "307" && "$CODE" != "308" ]]; then
              echo "::warning::Page $path returned HTTP $CODE"
              FAILED=1
            fi
          done
          echo "pages_failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Open or update outage issue
        if: steps.check.outputs.health_status != '200' || steps.check.outputs.pages_failed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEALTH_STATUS: ${{ steps.check.outputs.health_status }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Production health check failed" in:title' --json number --jq '.[0].number // empty')"
          BODY="Production health check failed. Health endpoint HTTP: $HEALTH_STATUS. One or more critical pages may also have failed.\n\nRun: $RUN_URL"
          if [[ -z "$EXISTING" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Production health check failed" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

      - name: Close outage issue after recovery
        if: steps.check.outputs.health_status == '200' && steps.check.outputs.pages_failed == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Production health check failed" in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "Production health checks recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            gh issue close "$EXISTING"
          fi

      - name: Fail workflow if production is unhealthy
        if: always()
        env:
          HEALTH_STATUS: ${{ steps.check.outputs.health_status }}
          PAGES_FAILED: ${{ steps.check.outputs.pages_failed }}
        run: |
          set -euo pipefail
          [[ "$HEALTH_STATUS" == "200" ]] || { echo "::error::Production health endpoint is unhealthy (HTTP $HEALTH_STATUS)."; exit 1; }
          [[ "$PAGES_FAILED" == "0" ]] || { echo "::error::One or more critical production pages are unhealthy."; exit 1; }
