name: DB Rescue retired — replacement VPS migration in progress

# Keep this legacy, broad database-rescue workflow inert. The new VPS rebuild
# workflow is app-only; source-data restore and schema changes remain governed by
# docs/RUNBOOK.md and must be validated in isolation before a separate recovery path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy DB rescue remains disabled. See docs/VPS_REPLACEMENT_MIGRATION.md."
