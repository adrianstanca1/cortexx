name: iOS — Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'Cortexx.html'
      - 'dist/**'
      - 'lib/**'
      - 'manifest.json'
      - 'sw.js'
      - 'scripts/check-ios-signing.mjs'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight after build?'
        required: false
        default: true
        type: boolean

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Archive & Upload
    runs-on: macos-14
    timeout-minutes: 60
    env:
      XCODE_SCHEME: App
      BUNDLE_ID: com.cortexbuild.app
      EXPORT_METHOD: app-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Check signing configuration
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          IOS_REQUIRE_ARCHIVE: 'false'
          IOS_REQUIRE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
        run: node scripts/check-ios-signing.mjs

      - name: Install JS dependencies
        working-directory: ios
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        working-directory: ios
        run: npm run build:web

      - name: Sync Capacitor iOS
        working-directory: ios
        run: npx cap sync ios

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ios/App/Pods
          key: pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Verify unsigned iOS build
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO -destination 'generic/platform=iOS Simulator' \
            build | tail -60

      - name: Verify unsigned iOS archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild archive -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath "$RUNNER_TEMP/Cortexx-unsigned.xcarchive" \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -80

      - name: Note verification-only push
        if: github.event_name == 'push' || !inputs.upload_to_testflight
        run: echo "Unsigned iOS build and archive verified. Native signing requires an explicit release request; use the EAS TestFlight workflow for the validated Apple upload path."

      - name: Import signing certificate
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'manual'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'manual'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build.mobileprovision
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Prepare App Store Connect API key
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'automatic'
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Set build number
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.archive_ready == 'true'
        working-directory: ios/App
        run: xcrun agvtool new-version -all "${{ github.run_number }}"

      - name: Archive signed app (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'manual'
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Cortexx.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='iPhone Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='Cortexx App Store' \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' \
            | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty

      - name: Archive signed app (automatic API-key signing)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'automatic'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Cortexx.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}' \
            | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty

      - name: Export IPA (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'manual'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ env.EXPORT_METHOD }}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${{ env.BUNDLE_ID }}</key><string>Cortexx App Store</string></dict>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cortexx.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" | tee -a "$RUNNER_TEMP/xcodebuild.log" | xcpretty

      - name: Export IPA (automatic API-key signing)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.signing_mode == 'automatic'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ env.EXPORT_METHOD }}</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Cortexx.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee -a "$RUNNER_TEMP/xcodebuild.log" | xcpretty

      - name: Locate exported IPA
        id: ipa
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.archive_ready == 'true'
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/ipa/*.ipa)
          if [ "${#files[@]}" -ne 1 ] || [ ! -s "${files[0]}" ]; then
            echo '::error::Export must produce exactly one non-empty IPA.'
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.upload_ready == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --apiKeyPath "$RUNNER_TEMP/AuthKey.p8" --verbose

      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && steps.signing.outputs.archive_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Cortexx-${{ github.run_number }}.ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Preserve Xcode diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Cortexx-xcode-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/build.mobileprovision"
