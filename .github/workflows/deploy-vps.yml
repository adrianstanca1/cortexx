name: VPS deployment retired — VPS-free migration in progress

# The previous production target required a VPS and SSH credentials that are
# no longer available. Keep this file as an explicit tombstone so no CI event
# can attempt the retired deployment. Do not re-enable until a replacement
# architecture has been reviewed and approved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "VPS deployment is retired. See docs/VPS_FREE_MIGRATION.md."
