name: Deploy CortexBuild Pro — One.com VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: cortexbuild-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    env:
      VPS_HOST: 85.190.100.68
      VPS_USER: administrator
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
      APP_URL: https://cortexbuildpro.tech
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Require successful CI for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&branch=main&event=push&status=success" --jq '.total_count')
          if [[ "$PASSED" -lt 1 ]]; then
            echo "::error::This exact main commit has not passed CI."
            exit 1
          fi

      # The production host also serves local LLMs. Building the Next.js image
      # there can exhaust RAM and interrupt SSH; build it on the CI runner.
      - name: Build production app and migration images on GitHub
        timeout-minutes: 30
        run: |
          set -euo pipefail
          docker build --file Dockerfile.construction --target runtime \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag cortexbuild-construction-app:latest .
          docker build --file Dockerfile.construction --target tools \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag cortexbuild-construction-tools:latest .
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          docker save cortexbuild-construction-app:latest cortexbuild-construction-tools:latest | \
            zstd -T4 -3 > "$RUNNER_TEMP/cortexx-images.tar.zst"
          test -s "$RUNNER_TEMP/cortexx-images.tar.zst"
          echo "Prebuilt image archive ready: $(du -h "$RUNNER_TEMP/cortexx-images.tar.zst" | cut -f1)"

      - name: Configure SSH client
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ -z "${VPS_SSH_KEY:-}" && -z "${VPS_PASSWORD:-}" ]]; then
            echo "::error::Configure VPS_SSH_PRIVATE_KEY or VPS_ROOT_PASSWORD."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          timeout 30s ssh-keyscan -T 5 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "${VPS_SSH_KEY:-}" ]]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/cortexx_deploy
            chmod 600 ~/.ssh/cortexx_deploy
          fi
          if [[ -n "${VPS_PASSWORD:-}" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

      - name: Resolve SSH authentication
        run: |
          set -euo pipefail
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=60)
          if [[ -s ~/.ssh/cortexx_deploy ]] && ssh "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$VPS_USER@$VPS_HOST" 'echo SSH_OK' >/dev/null 2>&1; then
            echo "CORTEXX_SSH_MODE=key" >> "$GITHUB_ENV"
            echo "SSH key authentication ready."
            exit 0
          fi
          if [[ -n "${VPS_PASSWORD:-}" ]]; then
            export SSHPASS="$VPS_PASSWORD"
            if sshpass -e ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST" 'echo SSH_OK' >/dev/null 2>&1; then
              echo "CORTEXX_SSH_MODE=password" >> "$GITHUB_ENV"
              echo "SSH password authentication ready."
              exit 0
            fi
          fi
          echo "::error::Could not authenticate to $VPS_USER@$VPS_HOST."
          exit 1

      - name: Transfer prebuilt production images to VPS
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=60)
          TARGET="$VPS_USER@$VPS_HOST:/home/administrator/production/cortexx-images-$RELEASE_SHA.tar.zst"
          if [[ "$CORTEXX_SSH_MODE" == key ]]; then
            scp "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$RUNNER_TEMP/cortexx-images.tar.zst" "$TARGET"
          else
            export SSHPASS="$VPS_PASSWORD"
            sshpass -e scp "${SSH_BASE[@]}" "$RUNNER_TEMP/cortexx-images.tar.zst" "$TARGET"
          fi
          echo "Prebuilt release images transferred."

      - name: Deploy isolated construction stack
        run: |
          set -euo pipefail
          SSH_BASE=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=60)
          if [[ "$CORTEXX_SSH_MODE" == key ]]; then
            REMOTE=(ssh "${SSH_BASE[@]}" -i ~/.ssh/cortexx_deploy "$VPS_USER@$VPS_HOST")
          else
            export SSHPASS="$VPS_PASSWORD"
            REMOTE=(sshpass -e ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST")
          fi
          "${REMOTE[@]}" "bash -s -- '$RELEASE_SHA'" <<'REMOTE_SCRIPT'
            set -euo pipefail
            RELEASE_SHA="$1"
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            # Emit periodic output even during DB migrations and container checks.
            (while sleep 30; do echo "Cortexx deployment heartbeat: $(date -u +%H:%M:%S)"; done) &
            HEARTBEAT_PID=$!
            trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT
            APP_DIR=/home/administrator/production/cortexx
            REPO=https://github.com/adrianstanca1/cortexx.git
            mkdir -p "$(dirname "$APP_DIR")"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin --prune
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Deployment checkout has local edits; preserve and review them before deploying." >&2
              exit 1
            fi
            if [ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]; then
              echo "Release superseded by a newer main commit; skipping stale deployment."
              exit 0
            fi
            git reset --hard "$RELEASE_SHA"
            echo "Deploying $(git rev-parse --short HEAD)"

            umask 077
            if [ ! -f .env.construction ]; then
              DBPASS="$(openssl rand -hex 24)"
              AUTHSECRET="$(openssl rand -hex 32)"
              JWTSECRET="$(openssl rand -hex 32)"
              CRONSECRET="$(openssl rand -hex 32)"
              BROWSERSECRET="$(openssl rand -hex 48)"
              ADMINPASS="$(openssl rand -hex 24)"
              printf '%s\n' \
                "POSTGRES_PASSWORD=$DBPASS" \
                "DATABASE_URL=postgresql://construction:$DBPASS@db:5432/construction?schema=public" \
                "REDIS_URL=redis://redis:6379" \
                "NEXTAUTH_SECRET=$AUTHSECRET" \
                "AUTH_SECRET=$AUTHSECRET" \
                "JWT_SECRET=$JWTSECRET" \
                "CRON_SECRET=$CRONSECRET" \
                "BROWSER_GATEWAY_INTERNAL_TOKEN=$BROWSERSECRET" \
                "NEXTAUTH_URL=https://cortexbuildpro.tech" \
                "AUTH_URL=https://cortexbuildpro.tech" \
                "APP_URL=https://cortexbuildpro.tech" \
                "NEXT_PUBLIC_SITE_URL=https://cortexbuildpro.tech" \
                "NEXT_PUBLIC_API_URL=https://cortexbuildpro.tech" \
                "ADMIN_EMAIL=admin@cortexbuildpro.tech" \
                "ADMIN_PASSWORD=$ADMINPASS" \
                "OLLAMA_BASE_URL=http://ollama:11434" \
                "OLLAMA_MODEL=qwen3:4b" \
                "OLLAMA_VISION_MODEL=moondream" \
                "NODE_ENV=production" > .env.construction
              printf '%s\n' "URL=https://cortexbuildpro.tech" "EMAIL=admin@cortexbuildpro.tech" "PASSWORD=$ADMINPASS" > .owner-credentials
              chmod 600 .env.construction .owner-credentials
            fi
            if ! grep -q '^CRON_SECRET=' .env.construction; then
              printf 'CRON_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env.construction
            fi
            if ! grep -q '^BROWSER_GATEWAY_INTERNAL_TOKEN=' .env.construction; then
              printf 'BROWSER_GATEWAY_INTERNAL_TOKEN=%s\n' "$(openssl rand -hex 48)" >> .env.construction
            fi
            chmod 600 .env.construction

            IMAGE_ARCHIVE="/home/administrator/production/cortexx-images-$RELEASE_SHA.tar.zst"
            test -s "$IMAGE_ARCHIVE"
            PREVIOUS_APP_IMAGE="$(docker inspect cortexbuild-construction-app-1 --format '{{.Image}}' 2>/dev/null || true)"
            if [[ "$PREVIOUS_APP_IMAGE" == sha256:* ]]; then
              docker tag "$PREVIOUS_APP_IMAGE" "cortexbuild-construction-app:rollback-$(printf '%.12s' "$RELEASE_SHA")"
            fi
            zstd --decompress --stdout "$IMAGE_ARCHIVE" | docker load
            rm -f "$IMAGE_ARCHIVE"
            for service in app tools; do
              actual="$(docker image inspect "cortexbuild-construction-$service:latest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              if [[ "$actual" != "$RELEASE_SHA" ]]; then
                echo "::error::Prebuilt $service image does not match the audited release commit."
                exit 1
              fi
            done
            # Browser gateway is cached and lightweight; do not rebuild Next.js on this host.
            docker compose --env-file .env.construction -f docker-compose.construction.yml build browser-gateway
            docker compose --env-file .env.construction -f docker-compose.construction.yml up -d --no-build db redis ollama browser-gateway
            docker compose --env-file .env.construction -f docker-compose.construction.yml --profile tools run --rm --interactive=false tools
            docker compose --env-file .env.construction -f docker-compose.construction.yml --profile tools run --rm --interactive=false tools npx tsx scripts/bootstrap-construction.ts
            docker compose --env-file .env.construction -f docker-compose.construction.yml up -d --no-build --no-deps --force-recreate app

            healthy=false
            for n in $(seq 1 45); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3020/api/health | node scripts/check-construction-health.cjs >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker compose --env-file .env.construction -f docker-compose.construction.yml logs --tail=180 app
              if [[ "$PREVIOUS_APP_IMAGE" == sha256:* ]]; then
                echo "New release unhealthy; restoring previous running image."
                docker tag "$PREVIOUS_APP_IMAGE" cortexbuild-construction-app:latest
                docker compose --env-file .env.construction -f docker-compose.construction.yml up -d --no-build --no-deps --force-recreate app || true
              fi
              exit 1
            fi
            running_revision="$(docker inspect cortexbuild-construction-app-1 --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "$running_revision" != "$RELEASE_SHA" ]]; then
              echo "::error::Running app container does not contain the release commit."
              exit 1
            fi
            echo "Verified live production container revision: $running_revision"

            bash ops/install-construction-app-crons.sh

            INGRESS=/home/administrator/video-lab/Caddyfile.viral-shorts
            if [ ! -f "$INGRESS" ]; then
              echo "Ingress file missing: $INGRESS" >&2
              exit 1
            fi
            BACKUP_DIR=/home/administrator/backups/cortexbuild-cutover
            mkdir -p "$BACKUP_DIR"
            INGRESS_BACKUP="$BACKUP_DIR/Caddyfile.$(date +%Y%m%d-%H%M%S)"
            cp "$INGRESS" "$INGRESS_BACKUP"
            rollback_ingress() {
              cat "$INGRESS_BACKUP" > "$INGRESS"
              docker exec viral-shorts-caddy caddy reload --config /etc/caddy/Caddyfile || true
            }
            trap rollback_ingress ERR
            if grep -q 'reverse_proxy 127.0.0.1:3020' "$INGRESS"; then
              echo "Ingress already targets CortexBuild."
            elif grep -q 'reverse_proxy 127.0.0.1:3010' "$INGRESS"; then
              sed '0,/reverse_proxy 127.0.0.1:3010/s//reverse_proxy 127.0.0.1:3020/' "$INGRESS_BACKUP" > "$INGRESS"
            else
              echo "Expected current ingress target not found; refusing blind cutover." >&2
              exit 1
            fi
            docker exec viral-shorts-caddy caddy validate --config /etc/caddy/Caddyfile
            docker exec viral-shorts-caddy caddy reload --config /etc/caddy/Caddyfile

            curl --fail --silent --show-error --max-time 15 https://cortexbuildpro.tech/api/health | node scripts/check-construction-health.cjs
            trap - ERR
            docker compose --env-file .env.construction -f docker-compose.construction.yml ps
          REMOTE_SCRIPT

      - name: Verify public release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$APP_URL/api/health" | node scripts/check-construction-health.cjs
          curl --fail --silent --show-error --max-time 20 -o /dev/null "$APP_URL/"
