<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CortexBuild Pro — Admin Console</title>
<meta name="theme-color" content="#0a0f1a"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0a0f1a; --bg1:#0e1626; --bg2:#13203a; --bg3:#1a2c4e;
    --amber:#ffb000; --blue:#2f6bff; --blue-l:#6aa0ff; --green:#10b981;
    --red:#ef4444; --t1:#eef3fb; --t2:#a9bcd6; --t3:#6f87a8;
    --hair:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg0);color:var(--t1);
    font-family:"DM Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;height:100%;}
  h1,h2,h3,.brand,.kpi-n{font-family:"Space Grotesk",system-ui,sans-serif;}
  a{color:var(--blue-l);text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  /* layout */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
  .side{background:linear-gradient(180deg,#0c1426,#0a0f1a);border-right:0.5px solid var(--hair);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .side .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
  .mk{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--amber),#ff8a00);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .mk svg{width:16px;height:16px;}
  .nav{padding:8px 12px;overflow:auto;flex:1;}
  .nav .sec-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);
    padding:14px 12px 6px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--t2);
    font-size:13.5px;font-weight:500;margin:2px 0;transition:.13s;}
  .nav a svg{width:17px;height:17px;opacity:.8;}
  .nav a:hover{background:var(--bg2);color:var(--t1);}
  .nav a.active{background:linear-gradient(135deg,rgba(255,176,0,.16),rgba(47,107,255,.1));color:#fff;
    box-shadow:inset 0 0 0 0.5px var(--hair);}
  .nav a.active svg{opacity:1;}
  .side .me{padding:12px 16px;border-top:0.5px solid var(--hair);font-size:12.5px;color:var(--t2);}
  .side .me b{color:var(--t1);}
  .side .me .logout{margin-top:8px;background:none;border:0.5px solid var(--hair);color:var(--t2);
    border-radius:8px;padding:6px 10px;width:100%;font-size:12px;}
  .main{min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
    border-bottom:0.5px solid var(--hair);background:rgba(10,15,26,0.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:19px;margin:0;letter-spacing:-0.3px;}
  .topbar .sub{font-size:12.5px;color:var(--t3);margin-top:2px;}
  .topbar .right{display:flex;align-items:center;gap:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;
    border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;transition:.15s;}
  .btn-primary{background:linear-gradient(135deg,var(--amber),#ff8a00);color:#0a0f1a;box-shadow:0 6px 18px rgba(255,176,0,0.25);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:var(--bg2);color:var(--t1);border:0.5px solid var(--hair);}
  .btn-ghost:hover{background:var(--bg3);}
  .btn-danger{background:rgba(239,68,68,0.14);color:#ff9a9a;border:0.5px solid rgba(239,68,68,0.3);}
  .btn-danger:hover{background:rgba(239,68,68,0.22);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .view{padding:24px 28px 80px;overflow:auto;}
  .hidden{display:none!important;}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .kpi{background:var(--bg1);border:0.5px solid var(--hair);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi .kpi-n{font-size:27px;font-weight:700;letter-spacing:-0.5px;}
  .kpi .kpi-l{font-size:12px;color:var(--t3);margin-top:3px;}
  .kpi .spark{position:absolute;right:-6px;bottom:-6px;width:84px;height:48px;opacity:.22;}
  .kpi.amber .kpi-n{color:var(--amber);} .kpi.blue .kpi-n{color:var(--blue-l);}
  .kpi.green .kpi-n{color:#6ee7b7;} .kpi.red .kpi-n{color:#ff9a9a;}

  /* panels / cards */
  .panel{background:var(--bg1);border:0.5px solid var(--hair);border-radius:16px;padding:18px 20px;margin-bottom:20px;}
  .panel h2{font-size:16px;margin:0 0 14px;letter-spacing:-0.2px;display:flex;align-items:center;gap:9px;}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}

  /* tables */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--t3);
    padding:10px 12px;font-weight:600;border-bottom:0.5px solid var(--hair);}
  td{padding:11px 12px;font-size:13px;color:var(--t2);border-bottom:0.5px solid rgba(255,255,255,0.04);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}

  /* pills */
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .pill.free{background:rgba(111,135,168,0.18);color:var(--t2);}
  .pill.pro{background:rgba(47,107,255,0.18);color:var(--blue-l);}
  .pill.enterprise{background:rgba(255,176,0,0.18);color:var(--amber);}
  .pill.open{background:rgba(239,68,68,0.18);color:#ff9a9a;}
  .pill.in_progress{background:rgba(255,176,0,0.18);color:var(--amber);}
  .pill.resolved,.pill.closed,.pill.paid{background:rgba(16,185,129,0.18);color:#6ee7b7;}
  .pill.due,.pill.high{background:rgba(255,176,0,0.16);color:var(--amber);}
  .pill.overdue,.pill.urgent{background:rgba(239,68,68,0.2);color:#ff9a9a;}
  .pill.suspended{background:rgba(239,68,68,0.2);color:#ff9a9a;}
  .pill.active{background:rgba(16,185,129,0.16);color:#6ee7b7;}
  .pill.admin{background:rgba(16,185,129,0.16);color:#6ee7b7;}
  .pill.disabled{background:rgba(120,120,140,0.22);color:#c0c6d4;}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters input,.filters select{background:var(--bg2);border:0.5px solid var(--hair);border-radius:10px;
    padding:9px 12px;color:var(--t1);font-size:13px;width:auto;}
  .filters input[type=search]{min-width:220px;}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,8,16,0.66);backdrop-filter:blur(3px);z-index:40;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--bg1);border:0.5px solid var(--hair);border-radius:16px;width:min(560px,100%);
    max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .modal .m-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:0.5px solid var(--hair);}
  .modal .m-head h3{margin:0;font-size:16px;}
  .modal .m-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal label{display:block;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
  .modal input,.modal select,.modal textarea{width:100%;background:var(--bg2);border:0.5px solid var(--hair);
    border-radius:10px;padding:10px 12px;color:var(--t1);font-size:14px;}
  .modal .m-foot{padding:14px 20px;border-top:0.5px solid var(--hair);display:flex;justify-content:flex-end;gap:10px;}
  .x{cursor:pointer;color:var(--t3);font-size:20px;line-height:1;background:none;border:none;}

  /* misc */
  .empty{color:var(--t3);font-size:13px;padding:22px;text-align:center;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .mini{font-size:12px;color:var(--t3);}
  .bar{height:8px;border-radius:6px;background:var(--bg3);overflow:hidden;min-width:80px;}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--blue));}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--t1);
    padding:11px 20px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);border:0.5px solid var(--hair);}
  .err-banner{background:rgba(239,68,68,0.14);color:#ff9a9a;border:0.5px solid rgba(239,68,68,0.3);
    border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:16px;}
  .login-wrap{max-width:390px;margin:14vh auto;}
  .login-wrap h1{font-size:26px;margin:0 0 6px;} .login-wrap p{color:var(--t3);font-size:14px;margin:0 0 24px;}
  .login-wrap label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:0.5px;}
  .login-wrap input{width:100%;background:var(--bg2);border:0.5px solid var(--hair);border-radius:10px;padding:11px 13px;color:var(--t1);font-size:14px;}
  .login-wrap .err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px;}
  .login-wrap .hint{font-size:12px;color:var(--t3);margin-top:18px;}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}.app{grid-template-columns:1fr;}.side{position:static;height:auto;flex-direction:row;overflow:auto;}.nav{display:flex;flex-wrap:wrap;}.nav .sec-lbl{display:none;}.side .me{display:none;}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap">
  <div class="brand" style="margin-bottom:18px">
    <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0f1a" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#0a0f1a"/></svg></span>
    CortexBuild <span style="color:var(--amber)">Pro</span>
  </div>
  <h1>Admin Console</h1>
  <p>Sign in with a platform-admin account to operate the SaaS.</p>
  <form id="loginForm">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@company.com" required/>
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" required/>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:22px">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
  <p class="hint"><a href="landing.html">← Back to site</a> · <a href="support.html">Support</a></p>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <!-- sidebar -->
  <aside class="side">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0f1a" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="#0a0f1a"/></svg></span>
      CortexBuild <span style="color:var(--amber)">Pro</span>
    </div>
    <nav class="nav" id="nav">
      <div class="sec-lbl">Operations</div>
      <a data-view="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
      <a data-view="tenants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>Tenants</a>
      <a data-view="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6"/></svg>Users</a>
      <a data-view="billing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v10H3zM3 11h18"/></svg>Billing</a>
      <div class="sec-lbl">Support</div>
      <a data-view="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Support</a>
      <a data-view="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Activity</a>
      <div class="sec-lbl">Platform</div>
      <a data-view="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>System</a>
      <a data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>Settings</a>
    </nav>
    <div class="me">
      <div>Signed in as <b id="meEmail">—</b></div>
      <div class="mini" id="meRole">platform admin</div>
      <button class="logout" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <!-- main -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="sub" id="viewSub">Platform overview</div>
      </div>
      <div class="right">
        <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
      </div>
    </div>
    <div class="view" id="view"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- modal host -->
<div id="modalHost"></div>

<script src="admin.js"></script>
</body>
</html>
